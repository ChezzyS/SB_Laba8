spring.application.name=lab7
server.port=8081

spring.datasource.url=jdbc:h2:./testdb/students;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update


management.endpoints.web.exposure.include=health,info,metrics,beans,env,mappings,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Lab 7 - Students and Study Groups
info.app.description=Web application with Thymeleaf, Spring Data JPA and H2
info.app.version=0.0.1
