spring.application.name=lab8

# База данных H2 в файле testdb/lab8 рядом с проектом
spring.datasource.url=jdbc:h2:./testdb/lab8
spring.datasource.username=sa
spring.datasource.password=

# Таблицы (STUDENTS, USERS, ROLES, USERS_ROLES) создаются автоматически по классам @Entity
# (по заданию при первом запуске можно поставить create, затем update; update подходит для обоих случаев)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-circular-references=true
